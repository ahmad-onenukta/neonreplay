services:
  worker:
    build: .
    command: python -m app.worker
    env_file: .env
    volumes: ["./data:/srv/data", "./config.yaml:/srv/config.yaml:ro"]
    restart: unless-stopped
  web:
    build: .
    command: uvicorn app.web:app --host 0.0.0.0 --port 8080
    env_file: .env
    ports: ["8080:8080"]
    volumes: ["./data:/srv/data", "./config.yaml:/srv/config.yaml:ro"]
    restart: unless-stopped
  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy_data:/data"]
    depends_on: [web]
    restart: unless-stopped
  cleanup:
    image: alpine
    command: sh -c "while true; do find /data/clips -name '*_raw.mp4' -mtime +2 -delete; find /data/clips -name '*.mp4' -mtime +14 -delete; sleep 3600; done"
    volumes: ["./data:/data"]
    restart: unless-stopped

  # Selbstheilendes Auto-Update: baut neu, solange der gebaute Stand != GitHub-Stand ist
  updater:
    image: docker:27-cli
    working_dir: /opt/neonreplay
    volumes: ["/var/run/docker.sock:/var/run/docker.sock", "/opt/neonreplay:/opt/neonreplay"]
    command:
      - sh
      - -c
      - |
        apk add --no-cache git >/dev/null 2>&1
        git config --global --add safe.directory /opt/neonreplay
        while true; do
          git fetch -q origin main && git reset -q --hard origin/main
          H=$$(git rev-parse HEAD)
          if [ "$$H" != "$$(cat data/.built 2>/dev/null)" ]; then
            echo "$$(date) build $$H" >> data/update.log
            if docker compose -p neonreplay up -d --build worker web caddy cleanup >> data/update.log 2>&1; then
              echo "$$H" > data/.built
            fi
          fi
          sleep 180
        done
    restart: unless-stopped

volumes:
  caddy_data:
