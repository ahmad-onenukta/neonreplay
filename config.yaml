  - name: jasontheween
    platform: twitch
    url: https://twitch.tv/jasontheween
    display: JasonTheWeen
    hashtags: "#JasonTheWeen"       # Pflicht laut Kampagne
    langs: [en]
    campaign: "Content Rewards – Jason Pool $9K (bis 30.11., 700K Views)"
    cpm_usd: 1.0                    # Pool-Kampagne: Anteil nach Views
    enabled: false
