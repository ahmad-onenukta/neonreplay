# NeonReplay – Konfiguration
# Kanäle: nur Streamer aus Kampagnen mit Clip-Erlaubnis (Whop/Vyro) eintragen!
channels:                           # enabled: true erst NACH Kampagnen-Beitritt + Regeln gelesen
  - name: lacy
    platform: twitch
    url: https://twitch.tv/lacy
    display: Lacy                   # Name in Caption (Kampagnen-Pflicht)
    hashtags: "#Lacy"               # Pflicht-Hashtag laut reachclipping.com/Lacy
    langs: [en]                     # Pflicht: >=50 % englischsprachiges Publikum
    campaign: "Content Rewards – LACY 30 Day ($25K Pool)"
    cpm_usd: 1.0                    # Pool-Kampagne: Anteil nach Views
    enabled: false
  - name: marlon
    platform: twitch
    url: https://twitch.tv/marlon
    campaign: "Content Rewards – Marlon $5K"
    cpm_usd: 2.5
    enabled: false
    blocked: true                   # Kampagne erlaubt KEINE Livestream-Clips -> nie aufnehmen/posten
  - name: jasontheween
    platform: twitch
    url: https://twitch.tv/jasontheween
    display: JasonTheWeen
    hashtags: "#JasonTheWeen"       # Pflicht laut Kampagne
    langs: [en]
    campaign: "Content Rewards – Jason Pool $9K (bis 30.11., 700K Views)"
    cpm_usd: 1.0                    # Pool-Kampagne: Anteil nach Views
    enabled: false
  - name: clix
    platform: twitch
    url: https://twitch.tv/clix
    display: Clix
    hashtags: "#Clix"               # Pflicht laut reachclipping.com/Clix
    langs: [en]                     # >=50 % englischsprachiges Publikum
    campaign: "Content Rewards – Clix Pool $5K (Nov, 500K Views)"
    cpm_usd: 1.0
    enabled: false
  - name: kaicenat
    platform: twitch
    url: https://twitch.tv/kaicenat
    display: Kai Cenat
    hashtags: "#KaiCenat"           # Pflicht laut Kampagne, Name in Caption
    langs: [en]
    campaign: "Content Rewards – Kai Cenat $10K GTA 6 Pool (750K Views)"
    cpm_usd: 1.0
    enabled: true
  - name: yourragegaming
    platform: twitch
    url: https://twitch.tv/yourragegaming
    display: YourRAGE
    hashtags: "#YourRAGE"
    langs: [en]
    campaign: "Content Rewards – YourRAGE $5K GTA 6 Pool (500K Views)"
    cpm_usd: 1.0
    enabled: true
  # Kick-Beispiel: url: https://kick.com/<slug>, platform: kick, optional chatroom_id: 123456 (falls kick.com-API blockt)
  # YouTube-Beispiel: url: https://www.youtube.com/@kanal/live, platform: youtube

buffer:
  segment_seconds: 10
  segments_kept: 60                 # 60 x 10 s = 10 Min Ringpuffer
  quality: "720p60,720p,best"

trigger:
  window_seconds: 10
  spike_factor: 3.0                 # Chat-Rate > 3x Durchschnitt
  min_msgs_per_sec: 4
  audio_peak_db: -6.0               # max_volume über diesem Wert = Peak
  cooldown_seconds: 120             # pro Kanal
  pre_seconds: 45                   # Sekunden vor dem Trigger
  post_seconds: 15                  # Sekunden nach dem Trigger

render:
  width: 1080
  height: 1920
  layout: blur                      # blur = 16:9 mittig auf unscharfem Hintergrund
  font: /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
  hook_color: "white"
  accent_color: "#FF2E88"

transcribe:
  engine: faster-whisper            # faster-whisper | none
  model: small

languages: [en]                     # nur englischer Kanal (DE/UR später)

posting:
  mode: auto                        # auto = fertige Clips gehen automatisch raus (queue = nur nach Freigabe)
  max_posts_per_account_per_day: 6    # Qualität statt Masse (TikTok zusätzlich max. 3 als Entwurf)
  min_minutes_between_posts: 120     # 2 Std. Abstand
  brands:                           # Metricool-Brand (blogId) je Sprache
    en: { blog_id: "", networks: [instagram, youtube] }   # TikTok separat als Entwurf (max. 3/Tag, Nutzer postet per Tipp)
    de: { blog_id: "", networks: [tiktok, instagram, youtube] }
    ur: { blog_id: "", networks: [tiktok, instagram, youtube] }

min_quality: 7                      # Clips unter 7/10 werden nicht gepostet
music_filter: true                  # GTA-Radiomusik per Demucs entfernen (YouTube Content ID)

spoiler_keywords: [ending, final mission, credits, abspann, finale]
